name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK（/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：它内部会装已下线的 "tools" 包，新版 cmdline-tools 上必失败。
      - name: 检查并补齐 Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT" || true
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 已有就跳过，没有才装
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -n 3
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 把 web/ 同步进 assets
        run: pwsh -NoProfile -File android/tools/sync-web.ps1

      - name: 构建 release APK（按 ABI 拆分 + R8）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验产物
        working-directory: android
        run: |
          set -e
          ls -lh app/build/outputs/apk/release/*.apk
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"
            "$AAPT2" dump badging "$f" | grep -E "^package:|^native-code:"
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursely-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag（v*）时把两个 APK 自动附到 Release 上
      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  unit-test:
    name: 单元测试（不阻塞发布）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查并补齐 Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -n 3
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - run: pwsh -NoProfile -File android/tools/sync-web.ps1

      - name: 跑单测（JUnit + Robolectric）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: 收集测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
