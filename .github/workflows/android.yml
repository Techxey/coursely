name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 platform 34 / build-tools 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 把 web/ 同步进 assets
        run: pwsh -NoProfile -File android/tools/sync-web.ps1

      - name: 构建 release APK（按 ABI 拆分 + R8）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验产物
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/release/*.apk
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"; "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$f" | head -3
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursely-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag（v*）时把两个 APK 自动附到 Release 上
      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  unit-test:
    name: 单元测试（不阻塞发布）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - run: pwsh -NoProfile -File android/tools/sync-web.ps1

      - name: 跑单测（Robolectric）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: 收集测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
